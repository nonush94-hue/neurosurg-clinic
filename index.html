<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neurosurg Exam">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#145F73">
<meta name="robots" content="noindex">
<title>Neurosurg Exam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}
/* Layout: barra sticky con schede orizzontali, un pannello alla volta, righe Dx/Sx affiancate per l'uso al letto del paziente */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#15262E; --muted:#5A6B73; --line:#D5DCDA;
  --accent:#145F73; --accent-ink:#FFFFFF; --ok:#1E7A55; --ok-ink:#FFFFFF; --alt:#B4412B; --alt-ink:#FFFFFF;
  --hint:#E4EFF1;
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1F; --surface:#16252C; --ink:#E6EEF0; --muted:#93A6AD; --line:#28404A;
    --accent:#5FB3C9; --accent-ink:#0B1A20; --ok:#5DC49A; --ok-ink:#0B1A20; --alt:#F0846B; --alt-ink:#0B1A20;
    --hint:#1B323A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#16252C; --ink:#E6EEF0; --muted:#93A6AD; --line:#28404A;
  --accent:#5FB3C9; --accent-ink:#0B1A20; --ok:#5DC49A; --ok-ink:#0B1A20; --alt:#F0846B; --alt-ink:#0B1A20;
  --hint:#1B323A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:900px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.tab{flex:none;white-space:nowrap;min-height:38px;padding:0 12px;border:1px solid transparent;background:none;color:var(--muted);font:500 14px var(--f-sans);border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tab[aria-selected="true"] .dot{background:var(--accent-ink)}
main{padding-block:16px max(40px,env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h2{font-size:17px;margin:0 0 2px;font-weight:600}
h3{font-size:13px;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.desc{color:var(--muted);font-size:13.5px;margin:0}
.btn{min-height:38px;padding:0 14px;border:1px solid var(--accent);background:none;color:var(--accent);font:500 14px var(--f-sans);border-radius:6px;cursor:pointer}
.btn.fill{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.btn.danger{border-color:var(--alt);color:var(--alt)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:38px;padding:0 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-t="ok"]{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.seg button[aria-pressed="true"][data-t="alt"]{background:var(--alt);border-color:var(--alt);color:var(--alt-ink)}
select,input[type=search],input[type=text],input[type=number],input[type=date],textarea{width:100%;min-height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:0 9px;font:inherit}
textarea{padding:8px 9px;min-height:84px;resize:vertical;line-height:1.5}
select.alt{border-color:var(--alt);color:var(--alt);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.side{font-size:12.5px;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px 12px;padding-block:10px;border-top:1px solid var(--line);align-items:start}
.row2:first-of-type{border-top:0}
.lbl{display:flex;flex-direction:column;min-width:0}
.lbl small{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.row2 .wide{grid-column:1/-1}
.row2 .deg{margin-top:4px}
.hint{background:var(--hint);border-radius:6px;padding:10px 12px;font-size:14px;margin-block:10px}
.hint[hidden]{display:none}
.mono{font-family:var(--f-mono)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.rep textarea{min-height:220px;font-family:var(--f-mono);font-size:13.5px;line-height:1.55}
.rep .acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
details.guide{background:var(--hint);border-radius:6px;padding:0 12px;margin-bottom:14px}
details.guide summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--accent)}
details.guide dl{margin:0 0 12px;display:grid;gap:8px;font-size:14px}
details.guide dt{font-weight:600}
details.guide dd{margin:0;color:var(--ink)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.g-table{width:100%;border-collapse:collapse;font-size:14px}
.g-wrap{overflow-x:auto}
.g-table td{padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.g-table td:first-child{font-weight:600;white-space:nowrap}
@media (max-width:560px){
  .row2{grid-template-columns:1fr 1fr}
  .row2 .lbl{grid-column:1/-1;flex-direction:row;gap:8px;align-items:baseline}
  .g-table td:first-child{white-space:normal}
}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:background .12s,color .12s}}
.mt{margin-top:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fields>*+*{margin-top:14px}
.fields>h3{margin-top:22px}
.plist{display:flex;flex-direction:column;margin-top:10px}
.prow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;color:var(--ink);font:inherit;cursor:pointer;min-height:54px}
.plist>.prow:first-child,.plist>.vrow:first-child{border-top:0}
.prow .pn{font-weight:600}
.prow .pm{font-size:13px;color:var(--muted)}
.vrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.vrow .prow{border-top:0;flex:1;min-width:0}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.danger.fill{background:var(--alt);color:var(--alt-ink)}
.calc{display:flex;align-items:center;min-height:38px;padding:0 9px;border:1px dashed var(--line);border-radius:5px;font-family:var(--f-mono)}
.banner{background:var(--alt);color:var(--alt-ink);padding:8px 12px;border-radius:6px;margin-top:8px;font-size:14px}
.hint.warn{border-left:3px solid var(--alt)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <div><h1 id="htitle">Neurosurg Exam</h1><div class="sub" id="hsub"></div></div>
      <div class="hbtns" id="hbtns"></div>
    </div>
    <div class="banner" id="banner" role="alert" hidden></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sezioni della visita" hidden></nav>
  </header>
  <main>
    <section id="v-home" hidden></section>
    <section id="v-pat" hidden></section>
    <div id="v-visit" hidden><div id="panels"></div></div>
  </main>
</div>
<input type="file" id="rfile" accept=".json,application/json" hidden>
<script src="fields.js"></script>
<script src="xlsx.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
